<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style/style.css">
  <title>Kahoot-like Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #333;
      /* Fundo escuro */
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-image: url(fundo.jpg);
    }

    .quiz-container {
      background-color: #4444449e;
      /* Container um pouco mais claro */
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      width: 90%;
      max-width: 1500px;
      height: 1000px;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    #question-text {
      background-color: #000;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      font-size: 1.5em;
      min-height: 50px;
      /* Para manter o layout estável */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #quiz-screen {
      img {
        height: 500px;
      }
    }

    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .answer-button {
      padding: 25px 15px;
      font-size: 1.1em;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.3s;
    }

    /* Cores do Kahoot */
    .answer-button:nth-child(1) {
      background-color: #7c61bb;
    }

    /* Vermelho */
    .answer-button:nth-child(2) {
      background-color: #1368ce;
    }

    /* Azul */
    .answer-button:nth-child(3) {
      background-color: #d89e00;
    }

    /* Amarelo */
    .answer-button:nth-child(4) {
      background-color: #ff00e6;
    }

    /* Verde */

    .answer-button:hover {
      transform: scale(1.03);
      opacity: 0.9;
    }

    /* Efeitos de Feedback */
    .correct {
      background-color: #2e8b57 !important;
      /* Verde Forte */
      animation: correct-pulse 0.5s;
    }

    .incorrect {
      background-color: #be1622 !important;
      /* Vermelho Forte */
      animation: incorrect-shake 0.5s;
    }

    @keyframes correct-pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    #timer {
      margin-top: 20px;
      font-size: 1.2em;
      color: yellow;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="quiz-container">
    <div id="quiz-screen">
        <a href="../html/jogos.html" class="btn-back">
    <span>← Voltar ao Menu</span>
  </a>
      <h2 id="question-text"></h2>
      <img src="fundo.jpg" alt="">
      <div id="answers-container" class="answers-grid"></div>
      <div id="timer">Tempo restante: <span id="time-left">10</span>s</div>
      <div id="score">Pontos: 0</div>
    </div>

    <div id="results-screen" class="hidden">
      <h2>Fim do Quiz!</h2>
      <p>Sua pontuação final é: <span id="final-score">0</span></p>
      <button onclick="window.location.reload()">Jogar Novamente</button>
    </div>
  </div>
  <div id="access-widget">
    <button id="access-btn" aria-label="Abrir Menu de Acessibilidade">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24">
        <path d="M12 2C13.1 2 14 2.9 14 4S13.1 6 12 6 10 2.9 10 4 10.9 2 12 2M21 9H15V22H13V16H11V22H9V9H3V7H21V9Z" />
      </svg>
    </button>
    <div id="access-panel" class="hidden">
      <div class="access-header">
        <h3>Acessibilidade</h3><button id="close-access">✕</button>
      </div>
      <div class="access-body">
        <div class="access-slider-group">
          <div class="slider-header"><span class="label">Tamanho</span><span id="font-size-val">100%</span></div>
          <div class="range-wrapper"><span class="small-a">A</span><input type="range" id="font-slider" min="100"
              max="160" value="100" step="5"><span class="big-a">A</span></div>
        </div>
        <div class="access-grid">
          <button onclick="toggleAccess('high-contrast')"><span class="icon">🌗</span><span
              class="label">Contraste</span></button>
          <button onclick="toggleAccess('grayscale')"><span class="icon">👁️</span><span
              class="label">P&B</span></button>
          <button onclick="toggleAccess('invert')"><span class="icon">🔄</span><span
              class="label">Inverter</span></button>
          <button onclick="toggleAccess('readable-font')"><span class="icon">Aa</span><span
              class="label">Legível</span></button>
          <button onclick="toggleAccess('stop-animations')"><span class="icon">⏸</span><span
              class="label">Pausar</span></button>
          <button onclick="toggleAccess('big-cursor')"><span class="icon">👆</span><span
              class="label">Cursor</span></button>
        </div>
      </div>
      <div class="access-footer"><button id="reset-access">Resetar</button></div>
    </div>
  </div>
  <script src="../js/script.js"></script>
  <script>
    // Dados do Quiz
    const questions = [
      {
        question: "Qual é a principal função da Matriz de Eisenhower (Urgente vs. Importante) na Performance Pessoal e Profissional?",
        answers: [
          { text: "Medir a satisfação do cliente em relação ao desempenho profissional.", correct: false },
          { text: "Priorizar tarefas com base na sua urgência e impacto nos objetivos.", correct: true },
          { text: "Alocar recursos financeiros para projetos de alta prioridade.", correct: false },
          { text: "Determinar os objetivos de longo prazo da carreira profissional.", correct: false },
        ],
      },
      {
        question: "No contexto de Linguagem em Multimeios, por que a habilidade de Storytelling (Contação de Histórias) é considerada crucial no mercado de trabalho?",
        answers: [
          { text: "Padroniza a comunicação interna, eliminando a informalidade", correct: false },
          { text: "Permite criar documentos técnicos complexos e detalhados.", correct: false },
          { text: "Facilita a memorização de informações e aumenta o engajamento da audiência.", correct: true },
          { text: "Padroniza a comunicação interna, eliminando a informalidade.", correct: false },
        ],
      },
      {
        question:
          "Qual é a principal desvantagem de uma Estrutura Organizacional Funcional (agrupada por departamentos como Marketing, Finanças, Produção)?",
        answers: [
          { text: "Incentivo excessivo à inovação e à dupla subordinação.", correct: false },
          { text: "Lentidão na tomada de decisão e 'visão em túnel' (pouca coordenação interdepartamental).", correct: true },
          { text: "Centralização de poder e dificuldade em desenvolver especialistas funcionais.", correct: false },
          { text: "Baixa eficiência devido à duplicação de recursos em cada departamento.", correct: false },
        ],
      },
      {
        question:
          "Um profissional utiliza o Trello ou o Asana para acompanhar o progresso das tarefas de uma equipa, definir prazos e alocar recursos. Que tipo de Ferramenta Digital ele está a usar?",
        answers: [
          { text: "Software de Análise de Dados (Business Intelligence)", correct: false },
          { text: "Ferramenta de Automação Robótica de Processos (RPA)", correct: false },
          { text: "Sistema de Comunicação e Mensagens Instantâneas (Chat)", correct: false },
          { text: "Ferramenta de Gestão de Projetos e Fluxo de Trabalho", correct: true },
        ],
      },
      {
        question:
          "O que a Resiliência representa no contexto de Performance Pessoal e Profissional?",
        answers: [
          { text: "A habilidade de dominar rapidamente novas tecnologias.", correct: false },
          { text: "A tendência a evitar conflitos e a ser sempre complacente", correct: false },
          { text: "A aptidão para superar adversidades e pressões, voltando ao estado normal de eficácia.", correct: true },
          { text: "A capacidade de delegar tarefas complexas aos colegas.", correct: false },
        ],
      },
      {
        question:
          "Na Organização e Estrutura Empresarial, o que define a Cultura Organizacional?",
        answers: [
          { text: "O conjunto de valores, crenças e normas compartilhadas que guiam o comportamento na organização.", correct: true },
          { text: "A estrutura hierárquica e o organograma da empresa.", correct: false },
          { text: "Apenas as regras e procedimentos formais descritos nos manuais da empresa.", correct: false },
          { text: "O salário e os benefícios oferecidos aos colaboradores.", correct: false },
        ],
      },
      {
        question:
          "Ao criar uma apresentação em multimeios, qual é a melhor prática para garantir que a linguagem visual reforce a mensagem principal?",
        answers: [
          { text: "Priorizar cores vibrantes e animações complexas em todas as transições.", correct: false },
          { text: "Colocar apenas imagens de stock aleatórias para preencher o espaço.", correct: false },
          { text: "Garantir que a imagem ou o gráfico seja relevante e simples, evitando distrações visuais.", correct: true },
          { text: "Usar o máximo de texto e gráficos possível em cada slide para detalhar a informação.", correct: false },
        ],
      },
      {
        question:
          "No que diz respeito às Ferramentas Digitais para o Mercado de Trabalho, qual a principal vantagem do uso de plataformas de colaboração em tempo real (como Google Workspace ou Microsoft 365)?",
        answers: [
          { text: "Priorizar cores vibrantes e animações complexas em todas as transições.", correct: false },
          { text: "Colocar apenas imagens de stock aleatórias para preencher o espaço.", correct: false },
          { text: "Garantir que a imagem ou o gráfico seja relevante e simples, evitando distrações visuais.", correct: true },
          { text: "Usar o máximo de texto e gráficos possível em cada slide para detalhar a informação.", correct: false },
        ],
      },
      {
        question:
          "Qual dos seguintes elementos reflete mais diretamente a proatividade como característica da Performance Pessoal e Profissional?",
        answers: [
          { text: "Realizar tarefas apenas após serem solicitadas pelo superior hierárquico.", correct: false },
          { text: "Identificar potenciais problemas ou oportunidades e iniciar ações para resolvê-los ou explorá-los.", correct: true },
          { text: "Manter um registo detalhado de todas as horas trabalhadas ao longo do mês.", correct: false },
          { text: "Priorizar o atendimento de e-mails urgentes em detrimento de tarefas importantes.", correct: false },
        ],
      },
      {
        question:
          "A Estrutura Organizacional Matricial é caracterizada por qual fenómeno?",
        answers: [
          { text: "A dupla subordinação: os funcionários reportam simultaneamente a um gestor funcional e a um gestor de projeto.", correct: true },
          { text: "O foco exclusivo na produção de um único produto ou serviço.", correct: false },
          { text: "Centralização total da tomada de decisão na alta administração.", correct: false },
          { text: "A eliminação de todos os departamentos funcionais.", correct: false },
        ],
      },
    ];

    // Variáveis de Estado
    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    const TIME_PER_QUESTION = 60; // 10 segundos por pergunta

    // Elementos do DOM
    const quizScreen = document.getElementById("quiz-screen");
    const resultsScreen = document.getElementById("results-screen");
    const questionText = document.getElementById("question-text");
    const answersContainer = document.getElementById("answers-container");
    const timerDisplay = document.getElementById("time-left");
    const scoreDisplay = document.getElementById("score");
    const finalScoreDisplay = document.getElementById("final-score");

    // --- Funções Principais ---

    function startQuiz() {
      currentQuestionIndex = 0;
      score = 0;
      scoreDisplay.textContent = `Pontos: ${score}`;
      showQuestion(questions[currentQuestionIndex]);
    }

    function showQuestion(q) {
      // 1. Resetar o Container
      answersContainer.innerHTML = "";

      // 2. Exibir o Texto da Pergunta
      questionText.textContent = q.question;

      // 3. Criar os Botões de Resposta
      q.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.textContent = answer.text;
        button.classList.add("answer-button");

        // Adiciona a lógica de clique
        button.addEventListener("click", () =>
          selectAnswer(answer.correct, button)
        );

        answersContainer.appendChild(button);
      });

      // 4. Iniciar o Timer
      startTimer();
    }

    function startTimer() {
      let timeLeft = TIME_PER_QUESTION;
      timerDisplay.textContent = timeLeft;

      // Limpa qualquer timer anterior
      clearInterval(timer);

      timer = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          // Se o tempo acabar, passa para a próxima pergunta sem pontuar
          questionText.textContent = "Tempo esgotado!";
          // Desabilita os botões para não permitir cliques depois do tempo
          disableAnswerButtons();
          // Espera um pouco e vai para a próxima
          setTimeout(nextQuestion, 1500);
        }
      }, 1000);
    }

    function disableAnswerButtons() {
      Array.from(answersContainer.children).forEach((button) => {
        button.disabled = true;
      });
    }

    function selectAnswer(isCorrect, selectedButton) {
      clearInterval(timer); // Para o timer
      disableAnswerButtons(); // Desabilita os botões

      if (isCorrect) {
        score += 100; // Pontua
        scoreDisplay.textContent = `Pontos: ${score}`;
        selectedButton.classList.add("correct"); // Feedback visual de acerto
        questionText.textContent = "CORRETO! +100 Pontos";
      } else {
        selectedButton.classList.add("incorrect"); // Feedback visual de erro
        questionText.textContent = "ERRADO! A resposta correta será marcada.";

        // Marca a resposta correta em verde
        const correctButton = Array.from(answersContainer.children).find(
          (btn) =>
            questions[currentQuestionIndex].answers.find(
              (a) => a.text === btn.textContent
            ).correct
        );
        if (correctButton) correctButton.classList.add("correct");
      }

      // Passa para a próxima pergunta após um pequeno delay
      setTimeout(nextQuestion, 2000);
    }

    function nextQuestion() {
      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {
        showQuestion(questions[currentQuestionIndex]);
      } else {
        showResults();
      }
    }

    function showResults() {
      quizScreen.classList.add("hidden");
      resultsScreen.classList.remove("hidden");
      finalScoreDisplay.textContent = score;
    }

    // --- Iniciar o Quiz ---
    startQuiz();
  </script>
</body>

</html>
