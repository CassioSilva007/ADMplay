<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdmPlay — Varredura Lexical</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/style.css">

  <style>
    /* CSS CRÍTICO PARA FUNCIONAMENTO DO GRID */
    .ws-cell {
        display: flex; 
        justify-content: center;
        align-items: center;
        user-select: none;
        cursor: pointer;
        font-weight: bold;
        text-transform: uppercase;
        border-radius: 4px;
    }

    /* Cores e Estados - ORDEM IMPORTA AQUI */
    
    /* 1. Palavras já encontradas (Verde) */
    .ws-cell.found {
        background-color: #10b981; 
        color: white;
    }
    
    /* 2. Seleção atual (Azul) - DEVE vir depois de .found para aparecer por cima ao arrastar */
    .ws-cell.selected {
        background-color: var(--primary, #0077b6);
        color: white;
    }
    
    .ws-cell.wrong {
        background-color: #ef4444; 
        color: white;
        transition: background-color 0.3s;
    }
    
    /* Animaçãozinha ao encontrar */
    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
    .ws-cell.found.just-found {
        animation: pulse 0.5s;
    }

    /* Acessibilidade e Layout */
    [vw] { pointer-events: none !important; }
    [vw-access-button] { pointer-events: auto !important; }
    #stage { z-index: -1 !important; pointer-events: none; }
    .ws-board-area, .ws-sidebar { position: relative; z-index: 10; }
  </style>
</head>

<body>

  <div id="stage"></div>

  <header class="games-header">
    <div class="brand-home">
        <img src="../img/ilha.png" alt="Logo" class="logo-img-small" onerror="this.style.display='none'">
        <h1 class="title">VARREDURA LEXICAL</h1>
    </div>
    <a href="minigames.html" class="btn-back">
        <span>← Voltar aos Jogos</span>
    </a>
  </header>

  <main class="viewport wordsearch-layout">
    
    <aside class="panel-left ws-sidebar">
      <div class="ws-info">
        <h2>ALVOS DE BUSCA</h2>
        <p>Localize os termos técnicos sorteados na matriz.</p>
      </div>

      <div id="lista" class="word-list-container">
        </div>
      
      <div id="status" class="status-monitor">Carregando dados...</div>
    </aside>

    <section class="panel-right ws-board-area">
      <div class="board-frame">
          <div id="grid" class="ws-grid" role="grid" aria-label="Matriz de letras">
            </div>
      </div>
    </section>

  </main>

  <div id="explicacaoBox" class="modal-overlay hidden">
    <div class="modal-content tech-panel">
      <h3 id="tituloExplicacao">TERMO IDENTIFICADO</h3>
      <div class="divider"></div>
      <p id="textoExplicacao">Definição...</p>
      <button onclick="fecharExplicacao()" class="btn-primary full-width">CONFIRMAR DADOS</button>
    </div>
  </div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

    <div id="access-widget">
    <button id="access-btn" aria-label="Abrir Menu de Acessibilidade">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M12 2C13.1 2 14 2.9 14 4S13.1 6 12 6 10 2.9 10 4 10.9 2 12 2M21 9H15V22H13V16H11V22H9V9H3V7H21V9Z"/></svg>
    </button>
    <div id="access-panel" class="hidden">
        <div class="access-header"><h3>Acessibilidade</h3><button id="close-access">✕</button></div>
        <div class="access-body">
            <div class="access-slider-group"><div class="slider-header"><span class="label">Tamanho</span><span id="font-size-val">100%</span></div><div class="range-wrapper"><span class="small-a">A</span><input type="range" id="font-slider" min="100" max="160" value="100" step="5"><span class="big-a">A</span></div></div>
            <div class="access-grid">
                <button onclick="toggleAccess('high-contrast')"><span class="icon">🌗</span><span class="label">Contraste</span></button>
                <button onclick="toggleAccess('grayscale')"><span class="icon">👁️</span><span class="label">P&B</span></button>
                <button onclick="toggleAccess('invert')"><span class="icon">🔄</span><span class="label">Inverter</span></button>
                <button onclick="toggleAccess('readable-font')"><span class="icon">Aa</span><span class="label">Legível</span></button>
                <button onclick="toggleAccess('stop-animations')"><span class="icon">⏸</span><span class="label">Pausar</span></button>
                <button onclick="toggleAccess('big-cursor')"><span class="icon">👆</span><span class="label">Cursor</span></button>
            </div>
        </div>
        <div class="access-footer"><button id="reset-access">Resetar</button></div>
    </div>
  </div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>

  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget("https://vlibras.gov.br/app");
  </script>

  <script src="../js/script.js"></script>
  
  <script>
    /* =========================================
       LÓGICA DO CAÇA PALAVRAS (VERSÃO CORRIGIDA - INTERSEÇÃO PERMITIDA)
       ========================================= */

    const LINHAS = 13;
    const COLUNAS = 13;
    const NUM_PALAVRAS_JOGO = 8;

    let PALAVRAS = [];
    let EXPLICACOES = {};

    let matriz = [];
    let selecionadas = [];
    let coords = [];
    let achadas = new Set();
    let isDragging = false;
    let dragTouchId = null;

    const gridEl = document.getElementById('grid');
    const listaEl = document.getElementById('lista');
    const statusEl = document.getElementById('status');
    const explicacaoBox = document.getElementById('explicacaoBox');
    const tituloExplicacao = document.getElementById('tituloExplicacao');
    const textoExplicacao = document.getElementById('textoExplicacao');

    /* --- CARREGAMENTO DE DADOS (CSV) --- */
    async function loadGameData() {
        try {
            const response = await fetch('palavras.csv');
            if (!response.ok) throw new Error("Não foi possível ler palavras.csv");

            const text = await response.text();
            const lines = text.split('\n');
            const allWords = [];

            lines.forEach(line => {
                const parts = line.split(',');
                if (parts.length >= 2) {
                    const word = parts[0].trim().replace(/^\uFEFF/, '').toUpperCase(); 
                    const desc = parts.slice(1).join(',').trim();
                    if (word.length > 0 && word.length <= Math.max(LINHAS, COLUNAS)) {
                        allWords.push({ word, desc });
                    }
                }
            });
            return allWords;

        } catch (error) {
            console.error(error);
            statusEl.textContent = "Usando modo offline.";
            return [
                { word: "ERRO", desc: "Erro na leitura do arquivo." },
                { word: "SISTEMA", desc: "Conjunto de elementos." },
                { word: "DADOS", desc: "Informações brutas." },
                { word: "LOGICA", desc: "Raciocínio estruturado." }
            ];
        }
    }

    async function init(){
        const todosDados = await loadGameData();
        const dadosEmbaralhados = shuffle(todosDados);
        const sorteados = dadosEmbaralhados.slice(0, Math.min(NUM_PALAVRAS_JOGO, dadosEmbaralhados.length));

        PALAVRAS = sorteados.map(item => item.word);
        EXPLICACOES = {};
        sorteados.forEach(item => {
            EXPLICACOES[item.word] = item.desc;
        });

        matriz = Array.from({length:LINHAS}, ()=> Array.from({length:COLUNAS}, ()=> ""));
        selecionadas = []; coords = []; achadas.clear();
        statusEl.textContent = "Sistema pronto. Inicie a varredura.";

        listaEl.innerHTML = "";
        PALAVRAS.forEach(p => {
            const d = document.createElement('div');
            d.className = 'word-item';
            d.id = 'w_' + p;
            d.innerHTML = `<span class="icon">⌖</span> ${p}`;
            listaEl.appendChild(d);
        });

        placeWords(); 
        fillRandom(); 
        renderGrid();
    }

    function shuffle(a){ return a.sort(()=>Math.random()-0.5); }
    function indexFromXY(x,y){ return y*COLUNAS + x; }

    /* --- LÓGICA DE POSICIONAMENTO --- */
    function placeWords(){
        const directions = [
            { x: 1, y: 0 }, // Horizontal
            { x: 0, y: 1 }, // Vertical
            { x: 1, y: 1 }, // Diagonal Descendo
            { x: 1, y: -1 } // Diagonal Subindo
        ];

        for (const palavra of PALAVRAS){
            let placed = false, attempts = 0;
            
            while(!placed && attempts < 500){
                attempts++;
                const dir = directions[Math.floor(Math.random() * directions.length)];
                const len = palavra.length;
                let startX, startY;

                const maxX = (dir.x === 0) ? COLUNAS - 1 : COLUNAS - len;
                if (maxX < 0) continue; 
                startX = Math.floor(Math.random() * (maxX + 1));

                if (dir.y === 1) { 
                    const maxY = LINHAS - len;
                    if (maxY < 0) continue;
                    startY = Math.floor(Math.random() * (maxY + 1));
                } else if (dir.y === -1) { 
                    const minY = len - 1;
                    if (minY >= LINHAS) continue;
                    startY = Math.floor(Math.random() * (LINHAS - minY)) + minY;
                } else { // Horizontal (y=0)
                    startY = Math.floor(Math.random() * LINHAS);
                }

                let ok = true;
                for (let i = 0; i < len; i++){
                    const cx = startX + (i * dir.x);
                    const cy = startY + (i * dir.y);
                    if (cx < 0 || cx >= COLUNAS || cy < 0 || cy >= LINHAS) { ok = false; break; }

                    const cellContent = matriz[cy][cx];
                    // Permite sobreposição se a letra for igual
                    if (cellContent !== "" && cellContent !== palavra[i]) {
                        ok = false;
                        break;
                    }
                }

                if (ok){
                    for (let i = 0; i < len; i++){
                        const cx = startX + (i * dir.x);
                        const cy = startY + (i * dir.y);
                        matriz[cy][cx] = palavra[i];
                    }
                    placed = true;
                }
            }
        }
    }

    function fillRandom(){
      const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      for (let r=0;r<LINHAS;r++){
        for (let c=0;c<COLUNAS;c++){
          if (!matriz[r][c] || matriz[r][c]==="") matriz[r][c] = letters[Math.floor(Math.random()*letters.length)];
        }
      }
    }

    /* --- RENDERIZAÇÃO --- */
    function renderGrid(){
      gridEl.innerHTML = "";
      gridEl.style.gridTemplateColumns = `repeat(${COLUNAS}, 1fr)`;
      
      for (let r=0;r<LINHAS;r++){
        for (let c=0;c<COLUNAS;c++){
          const el = document.createElement('div');
          el.className = 'ws-cell';
          el.textContent = matriz[r][c];
          el.dataset.x = c; el.dataset.y = r;
          
          el.addEventListener('mousedown', onPointerDown);
          el.addEventListener('mouseenter', onPointerEnter);
          el.addEventListener('mouseup', onPointerUp);
          
          el.addEventListener('touchstart', onTouchStart, {passive:false});
          el.addEventListener('touchmove', onTouchMove, {passive:false});
          el.addEventListener('touchend', onTouchEnd);

          gridEl.appendChild(el);
        }
      }

      window.addEventListener('mouseup', ()=> { if (isDragging) finalizeSelection(); isDragging = false; });
      window.addEventListener('touchend', ()=> { if (isDragging) finalizeSelection(); isDragging = false; dragTouchId = null; });
    }

    /* --- INTERAÇÃO (MODIFICADA PARA PERMITIR INTERSEÇÃO) --- */
    function getCellFromEventTarget(target){
      if (!target) return null;
      if (target.classList && target.classList.contains('ws-cell')) return target;
      return target.closest && target.closest('.ws-cell');
    }
    function coordsFromCell(cell){ return { x: +cell.dataset.x, y: +cell.dataset.y }; }

    let primeiroClique = null; 

    function onPointerDown(e){
      if(e.cancelable) e.preventDefault(); 
      if (e.button !== undefined && e.button !== 0) return;
      
      const cell = e.currentTarget;
      // [FIX] Não bloqueia mais células 'found'
      
      if (primeiroClique) {
          coords = getLineCoords(coordsFromCell(primeiroClique), coordsFromCell(cell));
          if (coords.length > 0) {
              selecionadas = coords.map(p => {
                  const idx = indexFromXY(p.x, p.y);
                  return gridEl.children[idx];
              });
              selecionadas.forEach(el => el.classList.add('selected'));
              finalizeSelection();
          } else {
              clearSelection();
          }
          primeiroClique = null;
          return;
      }

      isDragging = true; 
      clearSelection();
      pushSelection(cell, 'end');
      primeiroClique = cell; 
    }

    function onPointerEnter(e){
      if (!isDragging) return;
      const cell = e.currentTarget;
      // [FIX] Não bloqueia mais células 'found'
      
      if (cell !== primeiroClique) {
          primeiroClique = null; 
          selectedMoveOver(cell);
      }
    }

    function onPointerUp(e){ 
      if (!isDragging) return; 
      isDragging = false; 
      if (primeiroClique) return; 
      finalizeSelection(); 
    }

    /* --- TOUCH (MODIFICADO) --- */
    function onTouchStart(e){
        if(e.cancelable) e.preventDefault();
        const touch = e.changedTouches[0];
        dragTouchId = touch.identifier;
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        const cell = getCellFromEventTarget(target);
        
        // [FIX] Permite começar em cima de uma já encontrada
        if (cell) {
            isDragging = true;
            primeiroClique = null;
            clearSelection();
            pushSelection(cell, 'end');
        }
    }

    function onTouchMove(e){
      e.preventDefault();
      if (!isDragging) return;
      let touch = null;
      for (const t of e.changedTouches) if (t.identifier === dragTouchId) { touch = t; break; }
      if (!touch) return;
      const target = document.elementFromPoint(touch.clientX, touch.clientY);
      const cell = getCellFromEventTarget(target);
      
      if (!cell) return;
      selectedMoveOver(cell);
    }

    function onTouchEnd(e){ isDragging = false; dragTouchId = null; finalizeSelection(); }

    function getLineCoords(start, end) {
        const points = [];
        const dx = Math.abs(end.x - start.x);
        const dy = Math.abs(end.y - start.y);
        
        if (dx !== 0 && dy !== 0 && dx !== dy) return [];

        const sx = (start.x < end.x) ? 1 : -1;
        const sy = (start.y < end.y) ? 1 : -1;
        let x = start.x;
        let y = start.y;
        
        const steps = Math.max(dx, dy);

        for(let i=0; i<=steps; i++) {
            points.push({x, y});
            if (x !== end.x) x += sx;
            if (y !== end.y) y += sy;
        }
        return points;
    }

    /* --- SELEÇÃO --- */
    function selectedMoveOver(cell){
      const idx = selecionadas.indexOf(cell);
      
      // Permite voltar o mouse para desfazer seleção
      if (idx !== -1){
        if (idx === selecionadas.length - 2){
          const removed = selecionadas.pop(); 
          coords.pop(); 
          removed.classList.remove('selected');
        }
        return;
      }
      
      if (selecionadas.length === 0){ pushSelection(cell, 'end'); return; }
      
      const first = coords[0];
      const last = coords[coords.length -1];
      const c = coordsFromCell(cell);

      function adjacent(a,b){ 
        return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y)) === 1;
      }

      if (adjacent(last, c)){
        if (coords.length === 1){
           pushSelection(cell, 'end'); 
           return;
        } else {
          const d = { dx: Math.sign(coords[1].x - coords[0].x), dy: Math.sign(coords[1].y - coords[0].y) };
          const expected = { x: last.x + d.dx, y: last.y + d.dy };
          if (c.x === expected.x && c.y === expected.y){ pushSelection(cell, 'end'); return; }
        }
      }
    }

    function pushSelection(cell, pos='end'){
      // [FIX] Só bloqueia se já estiver SELECIONADO nesta tentativa
      if (cell.classList.contains('selected')) return;

      const p = coordsFromCell(cell);
      if (pos === 'end'){ selecionadas.push(cell); coords.push(p); } 
      else { selecionadas.unshift(cell); coords.unshift(p); }
      cell.classList.add('selected');
    }

    function finalizeSelection(){
      if (selecionadas.length < 2){ clearSelection(); return; }

      let wordString = "";
      for(let i=0; i<selecionadas.length; i++){
          wordString += selecionadas[i].textContent;
      }
      
      let encontrada = null;
      if (PALAVRAS.includes(wordString)) encontrada = wordString;
      else {
          const reversed = wordString.split('').reverse().join('');
          if (PALAVRAS.includes(reversed)) encontrada = reversed;
      }

      if (!encontrada){ 
          invalid(); 
          return; 
      }

      // SUCESSO
      for (const el of selecionadas){
        el.classList.remove('selected');
        el.classList.add('found');
        el.classList.add('just-found'); // Para animação
        setTimeout(() => el.classList.remove('just-found'), 600);
      }
      
      const li = document.getElementById('w_' + encontrada); 
      if (li) li.classList.add('found-word');
      
      if (!achadas.has(encontrada)) {
          achadas.add(encontrada);
          statusEl.textContent = `DADO LOCALIZADO: ${encontrada}`;
          statusEl.style.color = "#10b981";
          mostrarExplicacao(encontrada);
      }

      selecionadas = []; coords = [];
      
      if (achadas.size === PALAVRAS.length){
        setTimeout(()=> statusEl.textContent = 'PROTOCOLO CONCLUÍDO COM SUCESSO', 1000);
      }
    }

    function invalid(){
        selecionadas.forEach(el => el.classList.add('wrong'));
        setTimeout(() => {
            selecionadas.forEach(el => el.classList.remove('selected', 'wrong'));
            selecionadas = [];
            coords = [];
        }, 300);
    }

    function clearSelection(){
      selecionadas.forEach(el => el.classList.remove('selected', 'wrong'));
      selecionadas = []; 
      coords = [];
    }

    function mostrarExplicacao(p){
      tituloExplicacao.textContent = p;
      textoExplicacao.textContent = EXPLICACOES[p] || "Definição não encontrada.";
      explicacaoBox.classList.remove('hidden');
    }
    function fecharExplicacao(){
      explicacaoBox.classList.add('hidden');
    }

    init();

  </script>
</body>
</html>
