<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdmPlay — Personagem</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../style/style.css"> 
  </head>
<body>

  <div id="stage"></div>

  <main class="viewport char-layout">
    
    <section class="panel-left">
      <div class="brand-home">
        <a href="index.html" class="btn-back-link">
             ← VOLTAR
        </a>
      </div>

      <h1 class="title">NOVA PESSOA</h1>
      <p class="lead">Identifique-se para acessar o sistema de operações.</p>

      <form id="char-form" class="char-form">
        
        <div class="input-group">
            <label for="player-name">NOME DO GESTOR</label>
            <input type="text" id="player-name" placeholder="Digite seu nome..." required autocomplete="off">
        </div>

        <div class="selection-status">
            <p>Avatar Selecionado:</p>
            <span id="selected-role">Nenhum</span>
        </div>

        <button type="submit" class="btn-primary" id="btn-save">
            CONFIRMAR IDENTIDADE
        </button>

      </form>
    </section>

    <aside class="panel-right char-visual">
      
      <div class="char-grid">
        
        <div class="char-card" onclick="selectChar('male', this)">
            <div class="card-glow"></div>
            <img src="../anda/playerm_front.png" alt="Personagem Masculino" onerror="this.src='https://cdn-icons-png.flaticon.com/512/4128/4128176.png'">
            <div class="char-label">MASCULINO</div>
        </div>

        <div class="char-card" onclick="selectChar('female', this)">
            <div class="card-glow"></div>
            <img src="../anda/playerf_front.png" alt="Personagem Feminino" onerror="this.src='https://cdn-icons-png.flaticon.com/512/4128/4128253.png'">
            <div class="char-label">FEMININO</div>
        </div>

      </div>

    </aside>

  </main>

  <div id="access-widget">
    <button id="access-btn" aria-label="Acessibilidade">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24"><path d="M12 2C13.1 2 14 2.9 14 4S13.1 6 12 6 10 2.9 10 4 10.9 2 12 2M21 9H15V22H13V16H11V22H9V9H3V7H21V9Z"/></svg>
    </button>
    <div id="access-panel" class="hidden">
        <div class="access-header"><h3>Acessibilidade</h3><button id="close-access">✕</button></div>
             <div class="access-body">
                 <div class="access-grid">
                     <button onclick="toggleAccess('high-contrast')"><span class="icon">🌗</span><span class="label">Contraste</span></button>
                     <button onclick="toggleAccess('readable-font')"><span class="icon">Aa</span><span class="label">Legível</span></button>
                 </div>
                 <div class="access-footer"><button id="reset-access">Resetar</button></div>
             </div>
    </div>
  </div>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget("https://vlibras.gov.br/app");</script>
  
  <script src="/js/script.js"></script>

  <script>
    let selectedAvatar = null;

    function selectChar(type, element) {
        // Remove classe 'active' de todos
        document.querySelectorAll('.char-card').forEach(c => c.classList.remove('active'));
        
        // Adiciona ao clicado
        element.classList.add('active');
        
        // Atualiza estado
        selectedAvatar = type;
        const roleText = type === 'male' ? 'Executivo' : 'Executiva';
        document.getElementById('selected-role').textContent = roleText;
        document.getElementById('selected-role').style.color = 'var(--primary)';
    }

    document.getElementById('char-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('player-name').value;

        if(!selectedAvatar) {
            alert("Por favor, selecione um avatar clicando na imagem.");
            return;
        }

        if(!name) {
            alert("Por favor, digite seu nome.");
            return;
        }

        // Salva dados (pode ser usado nas outras páginas)
        localStorage.setItem('adm_player_name', name);
        localStorage.setItem('adm_player_avatar', selectedAvatar);

        // Feedback visual simples
        const btn = document.getElementById('btn-save');
        btn.textContent = "DADOS SALVOS!";
        btn.style.background = "#10b981"; // Verde sucesso
        
        setTimeout(() => {
            window.location.href = '../index.html'; // Volta para home ou vai para o jogo
        }, 1000);
        
    });

    
  </script>
</body>
</html>
